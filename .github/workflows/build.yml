name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bundle game (three.js + game code)
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AxeZombie.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AxeZombie-apk
          path: AxeZombie.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Axe Zombie v1.0.${{ github.run_number }}
          body: |
            Download **AxeZombie.apk** below on your Android phone and open it to install
            (allow "install unknown apps" for your browser/files app when prompted).
          files: AxeZombie.apk
          make_latest: true
